# Publica la demo (datos ficticios, sin backend) en GitHub Pages.
# Requiere, una sola vez: Settings → Pages → Source: "GitHub Actions".
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Exportar la demo a JSON
        run: python scripts/exportar_estatico.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: comuna-frontend/package-lock.json
      - name: Build estático
        working-directory: comuna-frontend
        env:
          VITE_MODO: estatico
          VITE_BASE: /comuna-dash/
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: comuna-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
